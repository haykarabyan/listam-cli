[project]
name = "listam-cli"
version = "0.1.0"
description = "Agent-friendly command-line interface for list.am (Armenian classifieds)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "haykarabyan" }]
requires-python = ">=3.10"
keywords = ["list.am", "armenia", "classifieds", "cli", "scraper", "ai-agents"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "curl_cffi>=0.7",
    "selectolax>=1.0",
]

[project.optional-dependencies]
# Resize/convert photos for `listam post` (otherwise only JPEGs up to 16 MB are accepted).
photos = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/haykarabyan/listam-cli"
Issues = "https://github.com/haykarabyan/listam-cli/issues"

[project.scripts]
listam = "listam.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listam"]
